<!DOCTYPE html>
<html>
<head>
    <title>State Shape Generator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .state-preview { margin: 10px; padding: 10px; border: 1px solid #ccc; }
        svg { border: 1px solid #eee; }
    </style>
</head>
<body>
    <h1>Generating Simple State Placeholder Images</h1>
    <p>This will create basic state outline images until we get real ones.</p>
    
    <div id="states"></div>
    
    <script>
        // Simple state shapes for immediate use
        const stateShapes = {
            TX: 'M 50,100 L 150,100 L 200,80 L 250,100 L 300,150 L 290,200 L 270,250 L 250,280 L 200,300 L 150,290 L 100,270 L 80,250 L 60,200 L 50,150 Z',
            CA: 'M 50,50 L 70,40 L 90,60 L 100,100 L 110,150 L 100,200 L 90,250 L 80,300 L 70,340 L 60,320 L 50,280 L 40,240 L 35,200 L 40,160 L 45,120 L 50,80 Z',
            FL: 'M 100,200 L 150,180 L 200,190 L 250,200 L 300,220 L 320,250 L 310,280 L 300,310 L 290,340 L 280,360 L 270,380 L 260,370 L 250,350 L 240,320 L 230,290 L 220,260 L 210,230 L 200,210 L 180,200 L 160,190 L 140,200 L 120,190 L 100,200 Z',
            NY: 'M 100,80 L 200,70 L 250,90 L 280,120 L 270,150 L 250,170 L 220,180 L 190,170 L 160,160 L 130,150 L 110,130 L 100,100 Z M 280,130 L 320,125 L 340,135 L 330,145 L 310,145 L 290,140 Z',
            MI: 'M 150,100 L 200,90 L 230,110 L 220,140 L 200,160 L 170,170 L 140,160 L 130,130 L 150,100 Z M 120,60 L 160,50 L 180,70 L 170,90 L 150,100 L 130,90 L 120,70 Z',
            AK: 'M 50,200 L 100,180 L 150,190 L 200,210 L 250,230 L 280,260 L 270,290 L 250,310 L 220,320 L 180,310 L 140,290 L 100,270 L 70,240 L 50,210 Z M 30,280 L 50,275 L 60,285 L 50,295 L 30,290 Z',
            HI: 'M 200,300 L 210,298 L 215,302 L 210,304 L 200,300 Z M 225,298 L 235,296 L 240,300 L 235,302 L 225,298 Z M 250,296 L 260,294 L 265,298 L 260,300 L 250,296 Z M 275,294 L 285,292 L 290,296 L 285,298 L 275,294 Z',
        }
        
        // Generate SVG for each state
        Object.keys(stateShapes).forEach(stateId => {
            const div = document.createElement('div')
            div.className = 'state-preview'
            div.innerHTML = `
                <h3>${stateId}</h3>
                <svg width="300" height="200" viewBox="0 0 350 400">
                    <rect width="100%" height="100%" fill="#f8fafc" />
                    <path d="${stateShapes[stateId]}" 
                          fill="#3b82f6" 
                          stroke="#1e40af" 
                          stroke-width="2" />
                </svg>
            `
            document.getElementById('states').appendChild(div)
        })
    </script>
</body>
</html>
